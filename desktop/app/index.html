  return `<button class="btn" data-act="back">‹ Все студенты</button><h1 style="margin:14px 0 2px">${esc(NAMES[i])}</h1><div class="sub" style="margin-bottom:10px">${periodLabel()}</div>`+period()+
  `<div class="panel"><div class="big">${s.all} ч · ${pairsWord(s.all/2)}</div><div class="chips" style="padding:8px 0 0">${chipsOf(s)}</div></div>`+
  (s.r.length?`<h2>По предметам</h2><div class="panel">${Object.entries(g).map(([k,v])=>`<div class="bs"><span>${esc(k)}</span><span>${v.h} ч · ${pairsWord(v.h/2)}</span></div><div class="sm">лекции ${v.lec} ч, семинары ${v.sem} ч${v.unk?", тип не указан "+v.unk+" ч":""}</div>`).join("")}</div><h2>Что и когда пропущено</h2><div class="recs" style="padding:0 0 8px">${s.r.map(x=>`<div class="rec"><b>${dstr(x.date)}</b><button class="mini" data-act="rtype" data-id="${x.id}">${TYPES[x.type]}</button><input data-f="rsub" data-id="${x.id}" value="${esc(x.subject)}" placeholder="Предмет" aria-label="Предмет"><div class="r2"><span>${x.hours} ч · ${pairsWord(x.hours/2)}${x.note?` · ${esc(x.note)}`:""}</span><span><button class="mini ${x.status==="?"?"":x.status}" data-act="rstat" data-id="${x.id}">${ST[x.status]}</button> <button class="mini" data-act="rdel" data-id="${x.id}" aria-label="Удалить">✕</button></span></div></div>`).join("")}</div>`:`<div class="empty" style="margin-top:12px">За этот период пропусков нет.</div>`)+
  `<div class="foot"><button class="btn pri" data-act="shareOne" data-i="${i}">Поделиться сводкой</button></div>`;
}
function cfgForm(){const f=(id,l,v,c)=>`<div class="${c||""}"><label for="${id}">${l}</label><input id="${id}" value="${esc(v)}"></div>`;return `<div class="panel"><div class="form">${f("cg","Группа",CFG.group)}${f("cc","Курс",CFG.course)}${f("cs","Специальность",CFG.spec,"full")}<div class="full"><label for="cw">Начало первой недели (для чередования расписания)</label><input type="date" id="cw" value="${CFG.w1}"></div></div><div class="foot"><button class="btn pri" data-act="saveCfg">Сохранить настройки</button></div></div><div style="height:12px"></div>`}
function viewGrp(){return cfgForm()+linkPanel()+`<div class="panel"><label class="hint" for="gn" style="display:block;margin-top:0">Список группы: одна фамилия на строку. При удалении студента его записи о пропусках будут удалены.</label><textarea id="gn" class="gt">${esc(NAMES.join("\n"))}</textarea><div class="foot"><button class="btn pri" data-act="saveNames">Сохранить список</button><button class="btn" data-act="clearAll">Очистить все пропуски</button></div></div>`}

function syncAttendanceUI(){render()}
const FB={},LKEY="yavka-link";
const lk=()=>{try{return JSON.parse(localStorage.getItem(LKEY))||{}}catch(e){return {}}};
const lkSet=o=>localStorage.setItem(LKEY,JSON.stringify({...lk(),...o}));
const defBase=()=>/^https?:/.test(location.protocol)?location.href.replace(/[?#].*$/,"").replace(/[^\/]*$/,""):"";
function linkPanel(){const L=lk();return `<div class="panel"><label class="hint" for="lb" style="display:block;margin-top:0">Ссылка для одногруппников: они выбирают себя и отмечают, на каких сегодняшних парах будут. Адрес вашего сайта (GitHub Pages):</label><div class="form"><div class="full"><input id="lb" value="${esc(L.base||defBase())}" placeholder="https://логин.github.io/репозиторий/"></div></div><div class="foot"><button class="btn pri" data-act="pubLink">${L.code?"Обновить и поделиться ссылкой":"Создать ссылку"}</button></div></div><div style="height:12px"></div>`}
function fbInit(){if(FB.db)return true;const c=window.FIREBASE_CONFIG;if(!window.firebase||!c||/ВСТАВЬ/.test(c.apiKey)){toast("Firebase не настроен или не загрузился");return false}firebase.initializeApp(c);FB.db=firebase.firestore();FB.auth=firebase.auth();return true}
async function fbUid(){let u=await new Promise(r=>{const o=FB.auth.onAuthStateChanged(x=>{o();r(x)})});if(!u)u=(await FB.auth.signInAnonymously()).user;return u.uid}
async function pubLink(){
  const base=($("#lb").value.trim()).replace(/\/?$/,"/");
  if(!/^https?:\/\/./.test(base)){toast("Укажите адрес сайта");return}
  if(!fbInit())return;
  try{
    const uid=await fbUid();let code=lk().code;
    if(!code)code=Array.from(crypto.getRandomValues(new Uint8Array(12)),b=>"abcdefghijkmnpqrstuvwxyz23456789"[b%32]).join("");
    await FB.db.doc("groups/"+code).set({ownerUid:uid,group:CFG.group,names:NAMES,sch:JSON.stringify(SCH),times:TIMES,w1:CFG.w1});
    lkSet({base,code});render();
    await share("Отметьтесь, на каких парах будете сегодня: "+base+"student.html?g="+code,"Явка "+CFG.group);
  }catch(e){if(e.code==="permission-denied"){lkSet({code:""});toast("Нет доступа к старой ссылке — создайте новую")}else toast("Ошибка: "+(e.code||e.message))}
}
async function pullAnswers(){
  const c=lk().code;
  if(!c){toast("Сначала создайте ссылку во вкладке «Группа»");return}
  if(!ui.slots.length){toast("Выберите пару в расписании");return}
  if(!fbInit())return;
  try{
    await fbUid();const q=await FB.db.collection("groups/"+c+"/att").where("date","==",ui.date).get(),got={};
    q.forEach(d=>{const x=d.data();got[x.i]=x.slots||{}});
    let yes=0,no=0,part=0,none=0;
    NAMES.forEach((_,i)=>{const s=got[i];if(!s){none++;return}const a=ui.slots.map(k=>s[k]);
      if(a.every(v=>v===true)){ui.marks[i]="p";yes++}
      else if(a.every(v=>v===false)){if(!ui.marks[i])ui.marks[i]="u";no++}
      else if(a.some(v=>v===true)&&a.some(v=>v===false))part++;
      else none++});
    toast("Будут: "+yes+", не будут: "+no+(part?", частично: "+part:"")+", не ответили: "+none);render();
  }catch(e){toast("Ошибка: "+(e.code||e.message))}
}

function render(){
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",t.dataset.v===ui.tab));
  const y=window.scrollY;$("#app").innerHTML=ui.tab==="today"?viewToday():ui.tab==="mark"?viewMark():ui.tab==="grp"?viewGrp():ui.detail!=null?viewDetail():viewSum();
  window.scrollTo({top:y,behavior:"instant"});fx();
}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;
  const a=b.dataset.act,i=+b.dataset.i,id=+b.dataset.id,r=S.recs.find(x=>x.id===id);
  if(["tab","open","back","pm","nm","allp"].includes(a))animate=true;if(a==="mu"||a==="me")ui.pop=i;
  if(a==="tab"){ui.tab=b.dataset.v;ui.detail=null;if(ui.tab==="today")ui.date=iso(new Date());if(ui.tab==="mark")loadMarks()}
  else if(a==="todaySlot"){ui.date=iso(new Date());const k=+b.dataset.k,p=parseSlot((SCH[weekOf(ui.date)][dowOf(ui.date)]||[])[k]);ui.slots=[k];ui.subject=p.name;ui.type=p.sem?"sem":"lec";ui.pairs=1;ui.tab="mark";loadMarks()}
  else if(a==="type"){ui.type=b.dataset.v;ui.slots=[];loadMarks()}
  else if(a==="slot"){const k=+b.dataset.k,dy=dayOf(),p=parseSlot(dy[k]),f=ui.slots.length?parseSlot(dy[ui.slots[0]]):null;
    if(f&&f.name===p.name&&f.sem===p.sem)ui.slots=ui.slots.includes(k)?ui.slots.filter(x=>x!==k):[...ui.slots,k].sort();else ui.slots=[k];
    if(ui.slots.length){const q=parseSlot(dy[ui.slots[0]]);ui.type=q.sem?"sem":"lec";ui.subject=q.name;ui.pairs=Math.min(4,ui.slots.length)}loadMarks()}
  else if(a==="mark"){const m=ui.marks[i];if(!m)ui.marks[i]="u";else if(m==="u")ui.marks[i]="e";else delete ui.marks[i];syncAttendanceUI();return}
  else if(a==="mu"||a==="me"||a==="mp"){const v=a==="mu"?"u":a==="me"?"e":"p";if(ui.marks[i]===v)delete ui.marks[i];else ui.marks[i]=v;syncAttendanceUI();return}
  else if(a==="allHere"){ui.marks={};syncAttendanceUI();return}
  else if(a==="saveCfg"){CFG={group:$("#cg").value.trim()||"—",course:$("#cc").value.trim(),spec:$("#cs").value.trim(),w1:$("#cw").value||CFG.w1};S.cfg=CFG;save();toast("Настройки сохранены")}
  else if(a==="saveNames"){const nn=$("#gn").value.split("\n").map(s=>s.trim()).filter(Boolean);if(!nn.length){toast("Список пуст");return}const map=NAMES.map(n=>nn.indexOf(n));const lost=S.recs.filter(x=>map[x.i]<0).length;if(lost&&!confirm("Будет удалено записей о пропусках: "+lost+". Продолжить?"))return;S.recs=S.recs.filter(x=>map[x.i]>=0).map(x=>({...x,i:map[x.i]}));NAMES=nn;S.names=nn;ui.marks={};save();toast("Список сохранён")}
  else if(a==="clearAll"){if(confirm("Удалить все записи о пропусках?")){S.recs=[];ui.marks={};save();toast("Очищено")}}
  else if(a==="saveMarks"){
    const sub=ui.subject.trim(),n=Object.keys(ui.marks).length;
    
    S.recs=S.recs.filter(x=>!(x.date===ui.date&&x.type===ui.type&&x.subject.toLowerCase()===sub.toLowerCase()&&(x.sl||"")===ui.slots.join(",")));
    Object.entries(ui.marks).forEach(([k,st])=>S.recs.push({id:S.uid++,i:+k,date:ui.date,type:ui.type,subject:sub,sl:ui.slots.join(","),hours:ui.pairs*2,status:st}));
    save();toast("Сохранено. Отсутствуют: "+n);burst();return;
  }
  else if(a==="open"){ui.detail=i;scrollTo(0,0)}
  else if(a==="back"){ui.detail=null}
  else if(a==="pm"||a==="nm"){const [y,m]=(ui.ym||iso(new Date()).slice(0,7)).split("-").map(Number);ui.ym=iso(new Date(y,m-1+(a==="nm"?1:-1),1)).slice(0,7)}
  else if(a==="allp"){ui.ym=ui.ym?"":iso(new Date()).slice(0,7)}
  else if(a==="rtype"){r.type=r.type==="lec"?"sem":"lec";save()}
  else if(a==="rstat"){r.status=r.status==="u"?"e":"u";save()}
  else if(a==="rdel"){S.recs=S.recs.filter(x=>x.id!==id);save()}
  else if(a==="shareOne"){shareXlsx([i],NAMES[i].split(" ")[0]).then(ok=>{if(!ok)share(textFor(i),NAMES[i])});return}
  else if(a==="shareAll"){shareXlsx(NAMES.map((_,k)=>k),CFG.group).then(ok=>{if(!ok)share(textAll(),"Явка "+CFG.group)});return}

  else if(a==="pubLink"){pubLink();return}
  else if(a==="pull"){pullAnswers();return}
    else if(a==="closeOv"){$("#ov").classList.remove("on");return}
  render();
});
document.addEventListener("input",e=>{
  const f=e.target.dataset.f;if(!f)return;
  if(f==="rsub"){const r=S.recs.find(x=>x.id===+e.target.dataset.id);r.subject=e.target.value;save();return}
  if(f==="subject"){ui.subject=e.target.value;return}
  if(f==="date"||f==="ym")return;
  ui[f]=+e.target.value;
});
document.addEventListener("change",e=>{
  const f=e.target.dataset.f;
  if(f==="subject"){ui.slots=[];loadMarks();render()}
  else if(f==="date"){ui.date=e.target.value;ui.slots=[];if(ui.date){loadMarks();render()}}
  else if(f==="ym"){ui.ym=e.target.value;animate=false;render()}
});

load();save();loadMarks();render();

</script>
</body>
</html>
